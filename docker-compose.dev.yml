# Dev overlay: reuses postgres/vault/vault-init from docker-compose.yml
# as-is, and swaps backend/frontend for hot-reloading dev images.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - backend_maven_repo:/root/.m2
    healthcheck:
      start_period: 120s

  frontend:
    build:
      dockerfile: Dockerfile.dev
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:9095/api}
      REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:9095}

volumes:
  backend_maven_repo:
  frontend_node_modules:
